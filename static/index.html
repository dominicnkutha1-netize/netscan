<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetScan — Port Mapper</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020b05;
    --surface: #050f07;
    --panel: #071a0a;
    --border: #0d3b15;
    --border-bright: #1a7a2e;
    --green: #00ff41;
    --green-dim: #00cc33;
    --green-muted: #007a1f;
    --green-glow: rgba(0,255,65,0.15);
    --amber: #ffaa00;
    --red: #ff3333;
    --cyan: #00ffff;
    --text: #b0ffb8;
    --text-dim: #4a8a52;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Orbitron', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Grid background */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border-bright);
    padding-bottom: 20px;
  }

  .logo-icon {
    width: 50px;
    height: 50px;
    border: 2px solid var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 15px var(--green-glow), inset 0 0 10px var(--green-glow);
    animation: pulse-border 3s ease-in-out infinite;
  }

  @keyframes pulse-border {
    0%,100% { box-shadow: 0 0 15px var(--green-glow), inset 0 0 10px var(--green-glow); }
    50% { box-shadow: 0 0 25px rgba(0,255,65,0.4), inset 0 0 20px rgba(0,255,65,0.2); }
  }

  .logo-text h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 900;
    color: var(--green);
    letter-spacing: 4px;
    text-shadow: 0 0 20px var(--green);
  }

  .logo-text p {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .status-bar {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--green);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Scan Panel */
  .scan-panel {
    background: var(--panel);
    border: 1px solid var(--border-bright);
    padding: 28px;
    margin-bottom: 24px;
    position: relative;
  }

  .scan-panel::before {
    content: 'SCAN CONFIG';
    position: absolute;
    top: -10px; left: 20px;
    background: var(--panel);
    padding: 0 10px;
    font-size: 10px;
    color: var(--green);
    letter-spacing: 3px;
    font-family: var(--font-display);
  }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 14px;
    margin-bottom: 14px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border-bright);
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: all 0.2s;
    width: 100%;
  }

  input[type="text"]:focus {
    border-color: var(--green);
    box-shadow: 0 0 10px var(--green-glow);
  }

  input[type="text"]::placeholder { color: var(--green-muted); }

  .presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .preset-btn {
    background: transparent;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1px;
  }

  .preset-btn:hover {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-glow);
  }

  .preset-btn.active {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-glow);
  }

  .scan-btn {
    background: transparent;
    border: 2px solid var(--green);
    color: var(--green);
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    padding: 14px 40px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .scan-btn:hover:not(:disabled) {
    background: var(--green-glow);
    box-shadow: 0 0 20px var(--green-glow);
  }

  .scan-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .scan-btn.scanning {
    animation: scan-pulse 1s ease-in-out infinite;
  }

  @keyframes scan-pulse {
    0%,100% { box-shadow: 0 0 10px var(--green-glow); }
    50% { box-shadow: 0 0 30px rgba(0,255,65,0.5); }
  }

  /* Progress */
  .progress-bar {
    height: 2px;
    background: var(--border);
    margin: 16px 0 0;
    display: none;
  }

  .progress-bar.active { display: block; }

  .progress-fill {
    height: 100%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    width: 0%;
    transition: width 0.1s;
    animation: progress-anim 2s linear infinite;
  }

  @keyframes progress-anim {
    0% { width: 5%; margin-left: 0; }
    50% { width: 60%; margin-left: 20%; }
    100% { width: 5%; margin-left: 90%; }
  }

  /* Terminal log */
  .terminal {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 14px;
    font-size: 12px;
    color: var(--text-dim);
    min-height: 60px;
    max-height: 140px;
    overflow-y: auto;
    margin-top: 14px;
    display: none;
  }

  .terminal.active { display: block; }

  .terminal p {
    margin-bottom: 2px;
    line-height: 1.6;
  }

  .terminal .ok { color: var(--green); }
  .terminal .info { color: var(--cyan); }
  .terminal .warn { color: var(--amber); }
  .terminal .err { color: var(--red); }

  /* Results */
  .results-panel {
    background: var(--panel);
    border: 1px solid var(--border-bright);
    padding: 28px;
    position: relative;
    display: none;
  }

  .results-panel.active { display: block; }

  .results-panel::before {
    content: 'SCAN RESULTS';
    position: absolute;
    top: -10px; left: 20px;
    background: var(--panel);
    padding: 0 10px;
    font-size: 10px;
    color: var(--green);
    letter-spacing: 3px;
    font-family: var(--font-display);
  }

  /* Summary row */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .summary-card {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 14px;
    text-align: center;
  }

  .summary-card .val {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 15px var(--green);
    display: block;
  }

  .summary-card .val.amber { color: var(--amber); text-shadow: 0 0 15px var(--amber); }
  .summary-card .val.red { color: var(--red); text-shadow: 0 0 15px var(--red); }

  .summary-card .lbl {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  .host-info {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 18px;
    padding: 10px 14px;
    background: var(--bg);
    border-left: 3px solid var(--green);
  }

  .host-info span { color: var(--green); }

  /* Port table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead tr {
    border-bottom: 1px solid var(--border-bright);
  }

  th {
    text-align: left;
    padding: 8px 12px;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: var(--font-display);
  }

  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tr:hover td { background: var(--green-glow); }

  .port-num {
    color: var(--cyan);
    font-weight: bold;
    font-size: 14px;
  }

  .service-tag {
    background: var(--border);
    padding: 2px 8px;
    font-size: 11px;
    color: var(--text);
  }

  .state-badge {
    display: inline-block;
    padding: 2px 8px;
    font-size: 10px;
    letter-spacing: 1px;
    background: rgba(0,255,65,0.1);
    border: 1px solid var(--green);
    color: var(--green);
  }

  .risk-badge {
    display: inline-block;
    padding: 2px 8px;
    font-size: 10px;
    letter-spacing: 1px;
    border: 1px solid;
    font-family: var(--font-display);
  }

  .risk-LOW { color: var(--green); border-color: var(--green); background: rgba(0,255,65,0.05); }
  .risk-MEDIUM { color: var(--amber); border-color: var(--amber); background: rgba(255,170,0,0.05); }
  .risk-HIGH { color: var(--red); border-color: var(--red); background: rgba(255,51,51,0.05); }

  .banner-text {
    font-size: 11px;
    color: var(--text-dim);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
    font-size: 13px;
  }

  .empty-state .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.4; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--green-muted); }

  /* Row animation */
  @keyframes row-in {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  tbody tr {
    animation: row-in 0.3s ease forwards;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-icon">⬡</div>
    <div class="logo-text">
      <h1>NETSCAN</h1>
      <p>Network Port Mapper v1.0</p>
    </div>
    <div class="status-bar">
      <div class="status-dot"></div>
      <span>SYSTEM ONLINE</span>
    </div>
  </header>

  <div class="scan-panel">
    <div class="input-row">
      <div class="input-group">
        <label>Target Host / IP Address</label>
        <input type="text" id="target" placeholder="192.168.1.1 or example.com" />
      </div>
      <div class="input-group">
        <label>Port Range</label>
        <input type="text" id="port-range" placeholder="1-1024" value="1-1024" />
      </div>
    </div>

    <div style="margin-bottom:6px">
      <label>Quick Presets</label>
    </div>
    <div class="presets" id="presets"></div>

    <button class="scan-btn" id="scan-btn" onclick="startScan()">
      ▶ INITIATE SCAN
    </button>

    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <div class="terminal" id="terminal"></div>
  </div>

  <div class="results-panel" id="results-panel">
    <div class="summary-row" id="summary-row"></div>
    <div class="host-info" id="host-info"></div>
    <div id="port-table-wrap"></div>
  </div>
</div>

<script>
  const API = window.location.origin;

  // Load presets
  async function loadPresets() {
    try {
      const res = await fetch(`${API}/api/quick-presets`);
      const data = await res.json();
      const container = document.getElementById("presets");
      data.presets.forEach(p => {
        const btn = document.createElement("button");
        btn.className = "preset-btn";
        btn.textContent = p.name;
        btn.onclick = () => {
          document.getElementById("port-range").value = p.range;
          document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        };
        container.appendChild(btn);
      });
    } catch {}
  }

  function log(msg, type = "") {
    const term = document.getElementById("terminal");
    term.classList.add("active");
    const p = document.createElement("p");
    p.className = type;
    p.innerHTML = `<span style="color:var(--text-dim)">[${new Date().toTimeString().slice(0,8)}]</span> ${msg}`;
    term.appendChild(p);
    term.scrollTop = term.scrollHeight;
  }

  function clearLog() {
    const term = document.getElementById("terminal");
    term.innerHTML = "";
  }

  async function startScan() {
    const target = document.getElementById("target").value.trim();
    const portRange = document.getElementById("port-range").value.trim();

    if (!target) {
      log("ERROR: No target specified.", "err");
      document.getElementById("terminal").classList.add("active");
      return;
    }

    const btn = document.getElementById("scan-btn");
    const progress = document.getElementById("progress-bar");
    btn.disabled = true;
    btn.classList.add("scanning");
    btn.textContent = "● SCANNING...";
    progress.classList.add("active");

    clearLog();
    log(`Initialising scan against <span class="ok">${target}</span>`, "info");
    log(`Port range: <span class="ok">${portRange}</span>`, "info");
    log("Resolving host...", "info");

    document.getElementById("results-panel").classList.remove("active");

    try {
      const res = await fetch(`${API}/api/scan`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target, port_range: portRange })
      });

      const data = await res.json();

      if (data.error) {
        log(`ERROR: ${data.error}`, "err");
      } else {
        log(`Host resolved: <span class="ok">${data.ip}</span>`, "ok");
        log(`Ports scanned: <span class="ok">${data.ports_scanned}</span> | Elapsed: <span class="ok">${data.elapsed}s</span>`, "ok");
        log(`Open ports found: <span class="ok">${data.open_ports.length}</span>`, "ok");

        if (data.risk_summary.HIGH > 0)
          log(`⚠ HIGH risk ports: ${data.risk_summary.HIGH}`, "warn");

        renderResults(data);
      }
    } catch (e) {
      log(`Connection error: ${e.message}`, "err");
    } finally {
      btn.disabled = false;
      btn.classList.remove("scanning");
      btn.textContent = "▶ INITIATE SCAN";
      progress.classList.remove("active");
    }
  }

  function renderResults(data) {
    const panel = document.getElementById("results-panel");
    panel.classList.add("active");

    // Summary cards
    document.getElementById("summary-row").innerHTML = `
      <div class="summary-card">
        <span class="val">${data.open_ports.length}</span>
        <span class="lbl">Open Ports</span>
      </div>
      <div class="summary-card">
        <span class="val">${data.ports_scanned}</span>
        <span class="lbl">Ports Scanned</span>
      </div>
      <div class="summary-card">
        <span class="val ${data.risk_summary.HIGH > 0 ? 'red' : ''}">${data.risk_summary.HIGH}</span>
        <span class="lbl">High Risk</span>
      </div>
      <div class="summary-card">
        <span class="val amber">${data.risk_summary.MEDIUM}</span>
        <span class="lbl">Med Risk</span>
      </div>
    `;

    // Host info
    document.getElementById("host-info").innerHTML =
      `TARGET: <span>${data.target}</span> &nbsp;|&nbsp; ` +
      `IP: <span>${data.ip}</span> &nbsp;|&nbsp; ` +
      `HOSTNAME: <span>${data.hostname}</span> &nbsp;|&nbsp; ` +
      `SCAN TIME: <span>${data.elapsed}s</span>`;

    // Table
    const wrap = document.getElementById("port-table-wrap");
    if (data.open_ports.length === 0) {
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="icon">⬡</div>
          <p>No open ports found in the specified range.</p>
        </div>`;
      return;
    }

    const rows = data.open_ports.map((p, i) => `
      <tr style="animation-delay:${i * 0.03}s">
        <td class="port-num">${p.port}</td>
        <td><span class="state-badge">OPEN</span></td>
        <td><span class="service-tag">${p.service}</span></td>
        <td><span class="risk-badge risk-${p.risk}">${p.risk}</span></td>
        <td><div class="banner-text" title="${p.banner || ''}">${p.banner || '<span style="opacity:0.3">—</span>'}</div></td>
      </tr>
    `).join("");

    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Port</th>
            <th>State</th>
            <th>Service</th>
            <th>Risk</th>
            <th>Banner</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  // Enter key to scan
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") startScan();
  });

  loadPresets();
</script>
</body>
</html>
